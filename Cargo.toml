[package]
name = "rail-craft"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded rail-craft research evaluator"
license = "MIT"
# Source archives carry the code, docs, examples, models, validation scripts and the small
# validation evidence; release packages, patches and timing evidence stay out.
include = [
  "/.gitignore",
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/**/*.rs",
  "/examples/**/*.rs",
  "/examples/**/*.py",
  "/examples/**/*.md",
  "/examples/**/*.txt",
  "/docs/*.md",
  "/models/*.json",
  "/python/**/*.py",
  "/python/**/*.json",
  "/validation/*.py",
  "/evidence/installed.json",
  "/evidence/native-sweep.json",
  "/evidence/occupancy.svg",
  "/evidence/scipy-search.json",
  "/evidence/validation.json",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
sha2 = "=0.10.9"
pyo3 = { version = "=0.29.0", optional = true, features = ["abi3-py310"] }
